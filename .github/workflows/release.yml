name: Python Multi-OS Release Pipeline

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  release-prep:
    name: Parse Versioning Flags
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.versioning.outputs.SHOULD_RELEASE }}
      is_prerelease: ${{ steps.versioning.outputs.IS_PRERELEASE }}
      tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
      release_name: ${{ steps.versioning.outputs.RELEASE_NAME }}
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Versioning and Handle Edge Cases
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          if [[ "$COMMIT_MSG" =~ -prod($|[[:space:]]) ]]; then
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" =~ -noprod($|[[:space:]]) ]]; then
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
          fi

          EXP_VERSION=$(echo "$COMMIT_MSG" | grep -oE -- '-[0-9]+$' | tr -d '-' || true)
          if [ ! -z "$EXP_VERSION" ]; then
            EXP_VERSION=$((10#$EXP_VERSION))
          fi

          LATEST_TAG=$(git tag -l "v*" 2>/dev/null | sort -V 2>/dev/null | tail -n 1 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            BASE_MAJOR=1
            BASE_MINOR=0
            HAS_TAGS=false
          else
            HAS_TAGS=true
            VERSION_NUM=${LATEST_TAG#v}
            VERSION_NUM=$(echo "$VERSION_NUM" | cut -d- -f1)
            if [[ "$VERSION_NUM" == *.* ]]; then
              BASE_MAJOR=$(echo "$VERSION_NUM" | cut -d. -f1)
              BASE_MINOR=$(echo "$VERSION_NUM" | cut -d. -f2)
            else
              BASE_MAJOR=$VERSION_NUM
              BASE_MINOR=0
            fi
          fi

          if [ ! -z "$EXP_VERSION" ]; then
            TARGET_VERSION="$EXP_VERSION"
          else
            if [ "$HAS_TAGS" = "false" ]; then
              TARGET_VERSION="1"
            else
              NEW_MINOR=$((BASE_MINOR + 1))
              TARGET_VERSION="$BASE_MAJOR.$NEW_MINOR"
            fi
          fi

          FINAL_TAG="v$TARGET_VERSION"
          COUNTER=1
          BASE_TARGET_VERSION="$TARGET_VERSION"
          while git rev-parse "$FINAL_TAG" >/dev/null 2>&1; do
            FINAL_TAG="v${BASE_TARGET_VERSION}-build${{ github.run_number }}-$COUNTER"
            COUNTER=$((COUNTER + 1))
          done
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=Easy Mod Downloader V${FINAL_TAG#v}" >> $GITHUB_OUTPUT

  compile-and-deploy:
    name: Compile on ${{ matrix.os }}
    needs: release-prep
    if: needs.release-prep.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: mod_downloader_linux
          - os: windows-latest
            artifact_name: mod_downloader_windows.exe
          - os: macos-latest
            artifact_name: mod_downloader_macos

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Python Context
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compiling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Package Executable Binary
        run: pyinstaller --onefile --clean mod_downloader.py

      - name: Standardize Binary Name for Release
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/mod_downloader.exe dist/${{ matrix.artifact_name }}
          else
            mv dist/mod_downloader dist/${{ matrix.artifact_name }}
          fi

      - name: Deploy Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
          name: "${{ needs.release-prep.outputs.release_name }}"
          tag_name: "${{ needs.release-prep.outputs.tag_name }}"
          prerelease: ${{ needs.release-prep.outputs.is_prerelease }}
          body: |
            ## Automated Standalone Multi-OS Production Build
            These cross-platform executable containers were dynamically generated and verified via automated PyInstaller packaging execution matrices.
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}